<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yasser</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #7C3AED;
            --primary-light: #8B5CF6;
            --primary-dark: #6D28D9;
            --background: #F9FAFB;
            --background-dark: #111827;
            --text: #1F2937;
            --text-light: #6B7280;
            --text-dark: #F9FAFB;
            --border: #E5E7EB;
            --border-dark: #374151;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .chat-container {
            width: 100%;
            max-width: 1000px;
            height: 90vh;
            background: white;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            padding: 1.5rem;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.25rem;
        }

        .header-info h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
        }

        .header-info p {
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message {
            display: flex;
            gap: 1rem;
            max-width: 80%;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .message-content {
            background: var(--primary);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 20px;
            border-bottom-right-radius: 4px;
            box-shadow: var(--shadow);
            white-space: pre-wrap;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #8c4cf0,rgb(142, 134, 252));
            border-radius: 20px;
            border-bottom-left-radius: 4px;
        }

        .message.bot .message-content {
            background: #F3F4F6;
            color: var(--text);
        }

        /* Add styles for bold text */
        .message-content strong {
            font-weight: 700;
        }

        /* Light mode bold text color */
        .message-content strong {
            color: #1469FA;
        }

        /* Dark mode bold text color */
        body.dark .message-content strong {
            color: #FFA700;
        }

        .chat-input {
            padding: 1.5rem;
            background: white;
            border-top: 1px solid var(--border);
        }

        .input-container {
            display: flex;
            gap: 1rem;
            background: #F3F4F6;
            padding: 0.5rem;
            border-radius: 16px;
        }

        .input-container input {
            flex: 1;
            border: none;
            background: none;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            color: var(--text);
            outline: none;
        }

        .input-container button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .input-container button:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .typing-indicator {
            display: flex;
            gap: 0.5rem;
            padding: 1rem 1.5rem;
            background: #F3F4F6;
            border-radius: 20px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-light);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        /* Dark mode styles */
        body.dark {
            background: var(--background-dark);
        }

        body.dark .chat-container {
            background: #1F2937;
        }

        body.dark .chat-header {
            background: #1F2937;
            border-bottom-color: var(--border-dark);
        }

        body.dark .header-info h1 {
            color: var(--text-dark);
        }

        body.dark .header-info p {
            color: var(--text-light);
        }

        body.dark .message.bot .message-content {
            background: #374151;
            color: var(--text-dark);
        }

        body.dark .chat-input {
            background: #1F2937;
            border-top-color: var(--border-dark);
        }

        body.dark .input-container {
            background: #374151;
        }

        body.dark .input-container input {
            color: var(--text-dark);
        }

        body.dark .typing-indicator {
            background: #374151;
        }

        /* Theme toggle */
        .theme-toggle {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            font-size: 1.5rem;
            transition: transform 0.2s;
            z-index: 2;
        }

        /* Logo styles */
        .logo-container {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem;
        }

        .logo-container img {
            max-height: 150px;
            width: auto;
            border-radius: 12px;
            
        }

        body.dark .theme-toggle {
            color: var(--text-dark);
        }

        .theme-toggle:hover {
            transform: rotate(30deg);
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        body.dark .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border-dark);
        }

        /* AI Selector Styles */
        .ai-selector {
            display: flex;
            gap: 0.5rem;
            padding: 1rem 1.5rem;
            background: white;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }

        .ai-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            background: #F3F4F6;
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .ai-btn:hover {
            background: #E5E7EB;
            transform: translateY(-1px);
        }

        .ai-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .ai-icon {
            font-size: 1rem;
        }

        .ai-name {
            font-weight: 600;
        }

        /* Translation button styles */
        .translate-btn {
            background: #10B981;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .translate-btn:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        .translate-btn:disabled {
            background: #9CA3AF;
            cursor: not-allowed;
            transform: none;
        }

        .translate-btn .translate-icon {
            font-size: 1rem;
        }

        /* Translated message styles */
        .message.translated .message-content {
            border-left: 4px solid #10B981;
        }

        .translation-label {
            font-size: 0.75rem;
            color: #10B981;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        /* Dark mode for translation */
        body.dark .translate-btn {
            background: #10B981;
        }

        body.dark .translate-btn:hover {
            background: #059669;
        }

        body.dark .translation-label {
            color: #34D399;
        }

        /* Dark mode for AI selector */
        body.dark .ai-selector {
            background: #1F2937;
            border-bottom-color: var(--border-dark);
        }

        body.dark .ai-btn {
            background: #374151;
            color: var(--text-dark);
        }

        body.dark .ai-btn:hover {
            background: #4B5563;
        }

        body.dark .ai-btn.active {
            background: var(--primary);
            color: white;
        }

        /* Test button styles */
        .test-button {
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .test-button:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, #059669, #047857);
        }

        .test-button .test-icon {
            font-size: 1rem;
        }

        /* Dark mode for test button */
        body.dark .test-button {
            background: linear-gradient(135deg, #10B981, #059669);
        }

        body.dark .test-button:hover {
            background: linear-gradient(135deg, #059669, #047857);
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        <div class="logo-container">
            <img src="/static/logo.png" alt="Logo" id="logo">
        </div>
        
        <div class="chat-header">
            <div class="avatar">Y</div>
            <div class="header-info">
                <h1>Yasser</h1>
                <p id="ai-description">Let me help you with Present Simple tense^^</p>
            </div>
        </div>
        
        <!-- AI Selection Buttons -->
        <div class="ai-selector">
            <button class="ai-btn active" data-ai="present_simple">
                <span class="ai-icon">📝</span>
                <span class="ai-name">Present Simple</span>
            </button>
            <button class="ai-btn" data-ai="past_simple">
                <span class="ai-icon">⏰</span>
                <span class="ai-name">Past Simple</span>
            </button>
            <button class="ai-btn" data-ai="future_simple">
                <span class="ai-icon">🔮</span>
                <span class="ai-name">Future Simple</span>
            </button>
            <button class="test-button" onclick="window.open('https://yasser-tests.onrender.com', '_blank')">
                <span class="test-icon">📝</span>
                Take your pre and post test here
            </button>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="message bot">
                <div class="message-content">
                    Hello! I'm your Present Simple Tense Checker. I'll help you improve your Present Simple tense usage. Please share your text and I'll provide hints for improvement!
                </div>
            </div>
        </div>

        <div class="chat-input">
            <form id="chat-form" class="input-container">
                <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off">
                <button type="submit">Send</button>
            </form>
        </div>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const chatMessages = document.getElementById('chat-messages');
        const themeToggle = document.querySelector('.theme-toggle');
        const aiButtons = document.querySelectorAll('.ai-btn');
        
        // Track current AI selection
        let currentAI = 'present_simple';

        // Function to convert markdown-style bold text to HTML
        function formatMessage(text) {
            // Convert **text** to <strong>text</strong>
            return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        }

        function addMessage(content, isUser = false, userMessage = '') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            // Format the message content
            const formattedContent = formatMessage(content);
            
            if (!isUser) {
                // Add translation button for bot messages
                messageDiv.innerHTML = `
                    <div class="message-content">
                        ${formattedContent}
                        <button class="translate-btn" onclick="translateMessage(this, '${userMessage.replace(/'/g, "\\'")}')">
                            <span class="translate-icon">🌐</span>
                            แปลเป็นไทย
                        </button>
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="message-content">
                        ${formattedContent}
                    </div>
                `;
            }
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function translateMessage(button, userMessage) {
            const messageDiv = button.closest('.message');
            const messageContent = messageDiv.querySelector('.message-content');
            
            // Disable the button and show loading state
            button.disabled = true;
            button.innerHTML = '<span class="translate-icon">⏳</span> กำลังสร้างคำตอบภาษาไทย...';
            
            try {
                const response = await fetch('/translate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: userMessage,
                        aiType: currentAI
                    })
                });

                const data = await response.json();
                
                if (data.translated_text) {
                    // Add translation label and Thai response
                    const translationLabel = document.createElement('div');
                    translationLabel.className = 'translation-label';
                    translationLabel.innerHTML = '<span>🇹🇭</span> คำตอบภาษาไทย:';
                    
                    const thaiResponseDiv = document.createElement('div');
                    thaiResponseDiv.innerHTML = formatMessage(data.translated_text);
                    thaiResponseDiv.style.marginTop = '0.5rem';
                    thaiResponseDiv.style.padding = '0.75rem';
                    thaiResponseDiv.style.background = '#FEF3C7';
                    thaiResponseDiv.style.borderRadius = '8px';
                    thaiResponseDiv.style.border = '1px solid #F59E0B';
                    thaiResponseDiv.style.color = '#92400E';
                    
                    // Dark mode styling for Thai response
                    if (document.body.classList.contains('dark')) {
                        thaiResponseDiv.style.background = '#451A03';
                        thaiResponseDiv.style.borderColor = '#F59E0B';
                        thaiResponseDiv.style.color = '#FCD34D';
                    }
                    
                    messageContent.appendChild(translationLabel);
                    messageContent.appendChild(thaiResponseDiv);
                    
                    // Hide the translate button
                    button.style.display = 'none';
                    
                    // Add translated class to message
                    messageDiv.classList.add('translated');
                } else {
                    throw new Error(data.error || 'Thai response generation failed');
                }
            } catch (error) {
                console.error('Thai response generation error:', error);
                // Reset button state
                button.disabled = false;
                button.innerHTML = '<span class="translate-icon">🌐</span> แปลเป็นไทย';
                alert('การสร้างคำตอบภาษาไทยล้มเหลว กรุณาลองใหม่อีกครั้ง');
            }
        }

        function showTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'message bot';
            indicator.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatMessages.appendChild(indicator);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return indicator;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = messageInput.value.trim();
            
            if (message) {
                addMessage(message, true);
                messageInput.value = '';
                
                const typingIndicator = showTypingIndicator();
                
                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: message,
                            aiType: currentAI
                        })
                    });

                    const data = await response.json();
                    typingIndicator.remove();
                    
                    if (data.response) {
                        addMessage(data.response, false, message);
                    } else {
                        addMessage("I apologize, but I encountered an error. Please try again.", false, message);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    typingIndicator.remove();
                    addMessage("I apologize, but I encountered an error. Please try again.", false, message);
                }
            }
        });

        // Handle Shift+Enter for new line
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        function toggleTheme() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Check for saved theme preference
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark');
            themeToggle.textContent = '☀️';
        }

        // AI Selection functionality
        aiButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Remove active class from all buttons
                aiButtons.forEach(btn => btn.classList.remove('active'));
                // Add active class to clicked button
                button.classList.add('active');
                // Update current AI
                currentAI = button.getAttribute('data-ai');
                
                // Add a system message to show AI change
                const aiName = button.querySelector('.ai-name').textContent;
                addMessage(`Switched to ${aiName} Tense Checker. I'm now ready to help you with ${aiName.toLowerCase()} tense usage!`, false);
                
                // Update header description
                const aiDescription = document.getElementById('ai-description');
                aiDescription.textContent = `Let me help you with ${aiName} tense^^`;
            });
        });

        // Focus input on load
        messageInput.focus();
    </script>
</body>
</html>
